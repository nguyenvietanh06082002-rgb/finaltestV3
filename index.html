<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò chơi di chuyển</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 min-h-screen bg-white font-sans text-gray-800">
    <div class="min-h-screen px-3 py-5 sm:px-6">
        <div class="mx-auto flex max-w-[1010px] flex-col items-center">

            <!-- Nút bắt đầu -->
            <button id="startButton" type="button"
                class="rounded-md bg-green-500 px-5 py-2 text-xs font-bold text-white shadow-md transition hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-300 active:scale-95">
                Bắt đầu
            </button>

            <!-- Khu vực trò chơi -->
            <div class="mt-5 flex w-full flex-col items-center justify-center gap-5 lg:flex-row lg:items-start">

                <!-- Bàn chơi -->
                <div class="grid w-full max-w-[618px] grid-cols-4 gap-4 rounded-lg bg-gray-50 p-4 shadow-md">
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-green-100 text-base font-bold text-green-600">
                        1</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-red-100 text-base font-bold text-red-500">
                        2</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-blue-100 text-base font-bold text-blue-500">
                        3</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-purple-100 text-base font-bold text-purple-500">
                        4</div>

                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-yellow-100 text-base font-bold text-yellow-600">
                        5</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-pink-100 text-base font-bold text-pink-500">
                        6</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-indigo-100 text-base font-bold text-indigo-500">
                        7</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-gray-100 text-base font-bold text-gray-500">
                        8</div>

                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-emerald-100 text-base font-bold text-emerald-600">
                        9</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-amber-100 text-base font-bold text-amber-600">
                        10</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-lime-100 text-base font-bold text-lime-600">
                        11</div>
                    <div class="aspect-square rounded-md bg-black"></div>
                </div>

                <!-- Đồng hồ và hướng dẫn -->
                <div class="flex w-full max-w-[130px] flex-col gap-4">

                    <!-- Đồng hồ -->
                    <div class="rounded-md bg-green-100 px-3 py-4 text-center shadow-md">
                        <div class="text-xs font-bold text-gray-900">
                            Đồng Hồ
                        </div>

                        <div id="timer" class="mt-2 text-xl font-bold text-gray-800">
                            00:00
                        </div>
                    </div>

                    <!-- Hướng dẫn di chuyển -->
                    <div class="rounded-md bg-gray-50 px-2 py-3 text-center shadow-md">
                        <div class="text-[11px] font-bold text-gray-900">
                            Hướng Dẫn Di Chuyển
                        </div>

                        <div class="mt-2 grid grid-cols-3 gap-1 text-[10px] font-bold">
                            <div></div>
                            <div class="rounded bg-gray-200 py-1">↑</div>
                            <div></div>

                            <div class="rounded bg-gray-200 py-1">←</div>
                            <div class="rounded bg-gray-200 py-1">↓</div>
                            <div class="rounded bg-gray-200 py-1">→</div>

                            <div></div>
                            <div class="rounded bg-gray-200 py-1">W</div>
                            <div></div>

                            <div class="rounded bg-gray-200 py-1">A</div>
                            <div class="rounded bg-gray-200 py-1">S</div>
                            <div class="rounded bg-gray-200 py-1">D</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lịch sử lượt chơi -->
            <div class="mt-5 w-full rounded-md bg-gray-50 p-4 shadow-md">
                <div class="mb-3 text-center text-xs font-bold text-gray-900">
                    Lịch Sử Lượt Chơi
                </div>

                <div class="grid grid-cols-3 bg-gray-200 text-[11px] font-bold">
                    <div class="border-r border-white px-2 py-2">#</div>
                    <div class="border-r border-white px-2 py-2">Bước đi</div>
                    <div class="px-2 py-2">Thời Gian</div>
                </div>

                <div id="history" class="text-[11px]"></div>
            </div>
        </div>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const timer = document.getElementById('timer');
        const history = document.getElementById('history');

        let seconds = 0;
        let intervalId;
        let moveNumber = 0;

        // Bắt đầu trò chơi và chạy đồng hồ
        startButton.addEventListener('click', () => {
            clearInterval(intervalId);

            seconds = 0;
            moveNumber = 0;

            timer.textContent = '00:00';
            history.innerHTML = '';
            startButton.textContent = 'Đang chơi';

            intervalId = setInterval(() => {
                seconds += 1;

                const minutes = String(
                    Math.floor(seconds / 60)
                ).padStart(2, '0');

                const remainingSeconds = String(
                    seconds % 60
                ).padStart(2, '0');

                timer.textContent = `${minutes}:${remainingSeconds}`;
            }, 1000);
        });

        // Ghi nhận phím di chuyển
        document.addEventListener('keydown', (event) => {
            const keys = {
                ArrowUp: 'Lên',
                ArrowDown: 'Xuống',
                ArrowLeft: 'Trái',
                ArrowRight: 'Phải',
                w: 'Lên',
                s: 'Xuống',
                a: 'Trái',
                d: 'Phải'
            };

            const direction =
                keys[event.key] ||
                keys[event.key.toLowerCase()];

            if (!direction || !intervalId) {
                return;
            }

            moveNumber += 1;

            const row = document.createElement('div');

            row.className =
                'grid grid-cols-3 border-b border-gray-200';

            row.innerHTML = `
        <div class="px-2 py-2">
          ${moveNumber}
        </div>

        <div class="px-2 py-2">
          ${direction}
        </div>

        <div class="px-2 py-2">
          ${timer.textContent}
        </div>
      `;

            history.appendChild(row);
        });
    </script>
</body>

</html>
