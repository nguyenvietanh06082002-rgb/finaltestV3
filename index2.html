<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Test V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="text-gray-500">
    <div class="px-3 py-5">
        <div class="mx-auto flex flex-col items-center">
            <button id="startButton"
                class="rounded-md bg-green-500 px-8 py-2 font-bold text-white shadow-md hover:bg-green-600 active:scale-95">
                Bắt đầu
            </button>
            <div class="mt-5 flex w-full flex-col items-center justify-center gap-5 lg:flex-row lg:items-start">
                <div class="grid w-full max-w-[620px] grid-cols-4 gap-4 rounded-lg bg-gray-50 p-4 shadow-md">
                    <div class="flex items-center justify-center rounded-md bg-green-100 font-bold text-green-600">
                        1</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-red-100 font-bold text-red-500">
                        2</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-blue-100 font-bold text-blue-500">
                        3</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-purple-100 font-bold text-purple-500">
                        4</div>

                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-yellow-100 font-bold text-yellow-600">
                        5</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-pink-100 font-bold text-pink-500">
                        6</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-indigo-100 font-bold text-indigo-500">
                        7</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-gray-100 font-bold text-gray-500">
                        8</div>

                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-emerald-100 font-bold text-emerald-600">
                        9</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-amber-100 font-bold text-amber-600">
                        10</div>
                    <div
                        class="flex aspect-square items-center justify-center rounded-md bg-lime-100 font-bold text-lime-600">
                        11</div>
                    <div class="aspect-square rounded-md bg-black"></div>
                </div>
                <div class="flex w-full max-w-[130px] flex-col gap-4">
                    <div class="rounded-md bg-green-100 px-3 py-4 text-center shadow-md">
                        <div class="text-xs font-bold text-gray-900">
                            Đồng Hồ
                        </div>
                        <div id="timer" class="mt-2 text-xl font-bold text-gray-800">
                            00:00
                        </div>
                    </div>
                    <div class="rounded-md bg-gray-50 px-2 py-3 text-center shadow-md">
                        <div class="text-[11px] font-bold text-gray-900">
                            Hướng Dẫn Di Chuyển
                        </div>
                        <div class="mt-2 grid grid-cols-3 gap-1 text-[10px] font-bold">
                            <div></div>
                            <div class="rounded bg-gray-200 py-1">↑</div>
                            <div></div>

                            <div class="rounded bg-gray-200 py-1">←</div>
                            <div class="rounded bg-gray-200 py-1">↓</div>
                            <div class="rounded bg-gray-200 py-1">→</div>

                            <div></div>
                            <div class="rounded bg-gray-200 py-1">W</div>
                            <div></div>

                            <div class="rounded bg-gray-200 py-1">A</div>
                            <div class="rounded bg-gray-200 py-1">S</div>
                            <div class="rounded bg-gray-200 py-1">D</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-5 w-full rounded-md bg-gray-50 p-4 shadow-md">
                <div class="mb-3 text-center text-xs font-bold text-gray-900">
                    Lịch Sử Lượt Chơi
                </div>

                <div class="grid grid-cols-3 bg-gray-200 text-[11px] font-bold text-gray-900">
                    <div class="border-r border-white px-2 py-2">#</div>
                    <div class="border-r border-white px-2 py-2">Bước đi</div>
                    <div class="px-2 py-2">Thời Gian</div>
                </div>

                <div id="history" class="text-[11px]"></div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
